name: Monitor official credit card sources
on:
  schedule:
    - cron: '23 1 * * *' # Taiwan 09:23 (UTC+8); best effort by GitHub Actions
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: cardwise-source-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Monitor official pages
        run: python scripts/monitor.py
      - name: Save daily monitoring status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json data/changes.txt
          git diff --cached --quiet || (git commit -m "chore: monitor official card sources" && git push)
      - name: Report changed or inaccessible sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/changes.txt ]; then
            {
              echo "Official source changed or could not be checked. Human verification required; do not change reward rules automatically."
              echo
              cat data/changes.txt
            } > /tmp/cardwise-monitor.md
            existing="$(gh issue list --state open --search 'in:title 信用卡條款來源待查核' --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file /tmp/cardwise-monitor.md
            else
              gh issue create --title "信用卡條款來源待查核" --body-file /tmp/cardwise-monitor.md
            fi
          fi
