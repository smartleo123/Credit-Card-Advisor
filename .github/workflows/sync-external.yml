name: Sync licensed credit card data
on:
  schedule:
    - cron: '17 2 * * *' # 10:17 Taipei time; GitHub schedules may run late
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: licensed-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate third-party API data
        id: sync
        continue-on-error: true
        run: python scripts/sync_external.py
      - name: Save validated snapshot or sync diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/external
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh licensed card catalog and source status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Open an issue on failed sync
        if: steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The licensed credit-card API sync was rejected. The last valid snapshot is preserved."
            echo
            cat data/external/sync-error.txt || true
          } >/tmp/cardwise-sync-failure.md
          gh issue create --title "信用卡資料 API 同步失敗：需要檢查格式或來源" --body-file /tmp/cardwise-sync-failure.md
      - name: Fail workflow when validation failed
        if: steps.sync.outcome == 'failure'
        run: exit 1
